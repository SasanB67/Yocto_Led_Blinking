BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "threeleds"
BBFILE_PATTERN_threeleds = "^${LAYERDIR}/"
BBFILE_PRIORITY_threeleds = "10"
LAYERDEPENDS_threeleds = "core openembedded-layer raspberrypi"
LAYERSERIES_COMPAT_threeleds = "scarthgap"

# Add the threeleds app (+ gpio tools for testing) to any image,
# e.g. core-image-minimal
RPI_EXTRA_CONFIG = "dtoverlay=disable-bt"
IMAGE_INSTALL:append = " threeleds"
